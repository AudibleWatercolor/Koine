<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1c2e">
<meta name="description" content="Learn the Biblical (Koine) Greek alphabet — pronunciation, examples, flashcards, and quizzes. Works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Koine Alphabet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Koine Alphabet — Biblical Greek</title>
</head>
<body>
<header>
  <h1>Koine Alphabet</h1>
  <p>Biblical Greek · New Testament</p>
</header>
<div class="progress-wrap"><div class="progress"></div></div>
<div id="install" class="install-banner">
  Install for offline use <button onclick="installApp()">Install</button>
</div>
<main id="main"></main>
<nav class="nav">
  <button data-v="learn" class="active"><span class="icon">Α</span>Learn</button>
  <button data-v="flash"><span class="icon">✦</span>Cards</button>
  <button data-v="quiz"><span class="icon">?</span>Quiz</button>
  <button data-v="ref"><span class="icon">i</span>Guide</button>
</nav>
<script src="app.js"></script>
</body>
</html>
